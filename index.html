<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="职英英语">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>职英 · 每日英语</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   设计基调：Google 式简洁浅色风
   ============================================================ */
:root{
  --primary:#1a73e8;
  --primary-hover:#1765cc;
  --primary-soft:#e8f0fe;
  --bg:#f8f9fa;
  --surface:#ffffff;
  --text:#202124;
  --text2:#5f6368;
  --text3:#80868b;
  --line:#dadce0;
  --green:#188038;
  --green-soft:#e6f4ea;
  --amber:#f9ab00;
  --amber-soft:#fef7e0;
  --red:#d93025;
  --red-soft:#fce8e6;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 1px 3px rgba(60,64,67,.12),0 1px 2px rgba(60,64,67,.08);
  --shadow-lg:0 4px 16px rgba(60,64,67,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Roboto','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
#app{max-width:640px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text)}
h1,h2,h3,h4{margin:0;font-weight:500}
a{color:var(--primary);text-decoration:none}

/* ---- 顶部栏 ---- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topbar .brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:.2px}
.topbar .brand .logo{
  width:30px;height:30px;border-radius:8px;background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.topbar .sub{font-size:12px;color:var(--text3);margin-top:1px}

/* ---- 视图容器 ---- */
.view{display:none;padding:16px 16px 110px}
.view.active{display:block}

/* ---- 底部导航 ---- */
.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:60;
  width:100%;max-width:640px;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 10px;color:var(--text3);font-size:11px;font-weight:500;
  transition:color .15s;
}
.nav-item svg{width:22px;height:22px}
.nav-item.on{color:var(--primary)}

/* ---- 卡片 ---- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
}
.card + .card{margin-top:14px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.section-title h2{font-size:16px;font-weight:700}
.section-title .more{font-size:13px;color:var(--primary);font-weight:500}

/* ---- 按钮 ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;
  transition:background .15s,box-shadow .15s;user-select:none;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--shadow)}
.btn-tonal{background:var(--primary-soft);color:var(--primary)}
.btn-tonal:hover{background:#d8e6fc}
.btn-outline{border:1px solid var(--line);color:var(--primary);background:#fff}
.btn-outline:hover{background:var(--primary-soft)}
.btn-block{width:100%}
.btn-icon{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.btn-icon:hover{background:var(--primary-soft)}
.btn-icon svg{width:22px;height:22px}
.btn-sm{padding:7px 14px;font-size:13px}

/* ---- 芯片 / 标签 ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--text2);white-space:nowrap;
}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---- 熟练度圆点 ---- */
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--primary)}
.dots i.m{background:var(--green)}

/* ---- 首页 ---- */
.greeting{font-size:22px;font-weight:700;margin:4px 2px 2px}
.greeting-sub{font-size:13px;color:var(--text2);margin-bottom:16px}
.checkin-hero{
  background:linear-gradient(135deg,#1a73e8,#4285f4);color:#fff;
  border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px;
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.checkin-hero .txt{flex:1}
.checkin-hero .big{font-size:28px;font-weight:700;line-height:1.2}
.checkin-hero .small{font-size:13px;opacity:.92;margin-top:2px}
.checkin-hero .btn{background:#fff;color:var(--primary);font-weight:700}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.quick-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  box-shadow:var(--shadow);color:var(--text);
}
.quick-card .num{font-size:20px;font-weight:700;color:var(--primary)}
.quick-card .lbl{font-size:12px;color:var(--text2)}
.stat-row{display:flex;gap:10px;margin-top:14px}
.stat-pill{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px;text-align:center;box-shadow:var(--shadow);
}
.stat-pill .v{font-size:20px;font-weight:700}
.stat-pill .l{font-size:12px;color:var(--text2)}
.phrase-of-day{display:flex;align-items:center;gap:12px}
.phrase-of-day .en{font-size:17px;font-weight:700}
.phrase-of-day .cn{font-size:13px;color:var(--text2);margin-top:2px}

/* ---- 闪卡 ---- */
.flash-wrap{display:flex;flex-direction:column;align-items:center}
.flash-progress{width:100%;height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.flash-progress i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .2s}
.flash-count{font-size:13px;color:var(--text2);margin-bottom:12px}
.flash-card{
  width:100%;max-width:360px;height:340px;perspective:1200px;cursor:pointer;user-select:none;
}
.flash-inner{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.flash-face.back{transform:rotateY(180deg);background:var(--primary-soft)}
.flash-face .term{font-size:32px;font-weight:700;letter-spacing:.3px}
.flash-face .phon{font-size:16px;color:var(--text2);margin-top:8px}
.flash-face .flip-hint{position:absolute;bottom:14px;font-size:12px;color:var(--text3)}
.flash-face .meaning{font-size:20px;font-weight:500;margin-top:8px}
.flash-face .example{font-size:14px;color:var(--text2);margin-top:14px;line-height:1.6}
.flash-face .category{position:absolute;top:16px;font-size:12px;color:var(--text3);background:var(--bg);padding:4px 10px;border-radius:999px}
.flash-actions{display:flex;gap:8px;width:100%;max-width:360px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.flash-actions .btn{flex:1;min-width:74px;padding:10px 6px;font-size:13px}
.btn-again{background:var(--red-soft);color:var(--red)}
.btn-hard{background:var(--amber-soft);color:#b06000}
.btn-good{background:var(--primary-soft);color:var(--primary)}
.btn-easy{background:var(--green-soft);color:var(--green)}
.flash-summary{text-align:center;padding:24px 0}
.flash-summary h3{font-size:22px;font-weight:700;margin-bottom:8px}
.flash-summary .note{font-size:14px;color:var(--text2);margin-bottom:20px}

/* ---- 词库 ---- */
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:10px 14px;
}
.searchbar svg{width:18px;height:18px;color:var(--text3);flex:none}
.searchbar input{border:none;outline:none;flex:1;background:transparent}
.word-row{
  display:flex;align-items:center;gap:10px;padding:13px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;
  content-visibility:auto;contain-intrinsic-size:auto 62px;
}
.word-row:last-child{border-bottom:none}
.word-row .w-main{flex:1;min-width:0}
.word-row .term{font-size:15px;font-weight:700}
.word-row .phon{font-size:12px;color:var(--text3);margin-left:6px}
.word-row .mean{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.word-row .cat{font-size:11px;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:999px;flex:none}
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-state .t{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:6px}
.empty-state .s{font-size:13px;line-height:1.6}

/* ---- 口语 ---- */
.phrase-card{content-visibility:auto;contain-intrinsic-size:auto 150px}
.phrase-card .p-top{display:flex;align-items:flex-start;gap:12px}
.phrase-card .p-en{font-size:17px;font-weight:700;line-height:1.4;flex:1}
.phrase-card .p-cn{font-size:14px;color:var(--text2);margin-top:4px}
.phrase-card .p-ex{
  font-size:13px;color:var(--text2);background:var(--bg);
  border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px;line-height:1.6;
}
.prof-row{display:flex;gap:6px;margin-top:12px}
.prof-seg{
  flex:1;text-align:center;font-size:12px;font-weight:500;padding:7px 0;
  border-radius:999px;border:1px solid var(--line);color:var(--text2);background:#fff;
}
.prof-seg.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* ---- 口语：发音与听力 ---- */
.p-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.p-acts .btn-sm{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--text2);border-radius:999px;padding:7px 13px;font-weight:500}
.p-acts .btn-sm svg{width:15px;height:15px;flex:none}
.p-acts .btn-sm:active{background:var(--primary-soft)}
.recite-btn{color:var(--primary)!important}
.recite-btn.on{background:var(--primary)!important;border-color:var(--primary)!important;color:#fff!important}
.hidden-en{filter:blur(6px);user-select:none;-webkit-user-select:none;pointer-events:none}
.hidden-en.show{filter:none;pointer-events:auto}
.score-badge{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--text2);white-space:nowrap}
.score-badge.s-g{background:var(--green-soft);color:var(--green);border-color:transparent}
.score-badge.s-o{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.score-badge.s-r{background:var(--red-soft);color:var(--red);border-color:transparent}
.rec-feedback{margin-top:10px;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;line-height:1.7;color:var(--text2)}
.rec-feedback .rec-score{font-size:20px;font-weight:700}
.rec-feedback .rec-want,.rec-feedback .rec-heard{font-size:13px;margin-top:3px}
.rec-feedback .rec-tip{margin-top:6px;font-size:13px}
.rec-hint{font-size:13px;color:var(--primary)}
.ai-card{
  border:1px dashed var(--primary);background:var(--primary-soft);
  border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;
}
.ai-card .ic{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ai-card .ic svg{width:24px;height:24px}
.ai-card .t{font-size:15px;font-weight:700}
.ai-card .s{font-size:13px;color:var(--text2);margin-top:2px}
.tag{font-size:11px;font-weight:700;color:var(--primary);background:#fff;border:1px solid var(--primary);padding:1px 8px;border-radius:999px;margin-left:6px}

/* ---- 语法 ---- */
.gram-card .g-t{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.gram-card .g-cat{font-size:11px;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:999px}
.gram-card .g-d{font-size:14px;color:var(--text2);line-height:1.7;margin-top:8px}
.gram-card .g-ex{font-size:13px;color:var(--text);background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px;line-height:1.7}
.quiz-box{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.quiz-box .q{font-size:14px;font-weight:500;margin-bottom:10px}
.opt{
  display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--radius-sm);font-size:14px;margin-bottom:8px;background:#fff;color:var(--text);
}
.opt:hover{background:var(--bg)}
.opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:500}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.quiz-feedback{font-size:13px;margin-top:8px}
.quiz-feedback.ok{color:var(--green)}
.quiz-feedback.no{color:var(--red)}

/* ---- 统计 ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ym{font-size:15px;font-weight:700}
.cal-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.cal-btn:hover{background:var(--bg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid .wd{text-align:center;font-size:11px;color:var(--text3);padding:2px 0}
.cal-cell{
  aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--text2);position:relative;
}
.cal-cell.done{background:var(--primary);color:#fff;font-weight:500}
.cal-cell.today{border:2px solid var(--primary);color:var(--primary);font-weight:700}
.cal-cell.done.today{border-color:#fff}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row .bl{width:52px;font-size:12px;color:var(--text2);text-align:right}
.bar-row .bt{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;background:var(--primary);border-radius:6px}
.bar-row .bn{width:26px;font-size:12px;font-weight:500}
.week-bars{display:flex;align-items:flex-end;gap:8px;height:90px;padding-top:6px}
.week-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week-bar .col{width:100%;max-width:26px;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:3px}
.week-bar .lb{font-size:11px;color:var(--text3)}
.week-bar .val{font-size:10px;color:var(--text2)}

/* ---- AI 占位 ---- */
.ai-hero{text-align:center;padding:40px 20px 20px}
.ai-hero .orb{
  width:96px;height:96px;border-radius:50%;margin:0 auto 20px;
  background:radial-gradient(circle at 32% 28%,#8ab4f8,#1a73e8);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 8px 30px rgba(26,115,232,.35);
}
.ai-hero .orb svg{width:48px;height:48px}
.ai-hero h2{font-size:22px;font-weight:700;margin-bottom:8px}
.ai-hero p{font-size:14px;color:var(--text2);line-height:1.7;max-width:340px;margin:0 auto}
.plan-list{margin-top:24px;text-align:left}
.plan-step{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.plan-step .n{
  width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;
}
.plan-step .b{font-size:14px;font-weight:500}
.plan-step .s{font-size:13px;color:var(--text2);margin-top:2px}

/* ---- 弹窗 ---- */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  padding:18px 20px 28px;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h3{font-size:18px;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  outline:none;background:#fff;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.field textarea{resize:vertical;min-height:76px}
.import-hint{font-size:12px;color:var(--text3);line-height:1.6;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px}
.hidden-file{display:none}

/* ---- toast ---- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:99;
  background:#323232;color:#fff;font-size:14px;padding:11px 18px;border-radius:999px;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center;
}
.toast.show{opacity:1}

/* ---- 通用小工具 ---- */
.flex{display:flex;align-items:center}
.between{justify-content:space-between}
.gap8{gap:8px}
.mt12{margin-top:12px}
.mt16{margin-top:16px}
.actions-bar{display:flex;gap:10px;margin-top:14px}
.actions-bar .btn{flex:1}

/* ---- AI 对话 ---- */
.ai-chat-page{display:flex;flex-direction:column;height:calc(100vh - 115px);margin:-16px -16px -110px}
.ai-chat-head{display:flex;align-items:center;gap:2px;padding:2px 0 6px}
.ai-chat-head .role{font-size:15px;font-weight:700;color:var(--primary);padding-left:4px}
.ai-chat-head .sub{font-size:12px;color:var(--text3);margin-left:8px}
.ai-msgs{flex:1;overflow-y:auto;padding:6px 2px 4px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.ai-msg{max-width:84%;display:flex;flex-direction:column}
.ai-msg .bubble{padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{align-self:flex-end;align-items:flex-end}
.ai-msg.user .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.ai-msg.ai{align-self:flex-start;align-items:flex-start}
.ai-msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.ai-msg .meta{display:flex;align-items:center;gap:2px;margin-top:2px;min-height:22px}
.ai-msg.user .meta{justify-content:flex-end}
.ai-typing{display:inline-flex;gap:4px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;align-self:flex-start;box-shadow:var(--shadow)}
.ai-typing i{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:blink 1.2s infinite}
.ai-typing i:nth-child(2){animation-delay:.2s}
.ai-typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.ai-input-bar{display:flex;gap:8px;align-items:flex-end;padding:8px 0 4px}
.ai-input-bar .inp{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 16px;min-height:46px}
.ai-input-bar .inp input{border:none;outline:none;flex:1;background:transparent;font-size:15px;min-width:0}
.ai-send{width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.ai-send:active{transform:scale(.94)}
.ai-send svg{width:22px;height:22px}
.ai-send.mic{background:var(--primary-soft);color:var(--primary)}
.ai-send.mic.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.45)}50%{box-shadow:0 0 0 9px rgba(217,48,37,0)}}
.ai-setup{text-align:center;padding:28px 8px 8px}
.ai-setup h2{font-size:22px;font-weight:700;margin:6px 0 8px}
.ai-setup p{font-size:14px;color:var(--text2);line-height:1.7;max-width:340px;margin:0 auto}
.ai-setup .orb{width:84px;height:84px;border-radius:50%;margin:0 auto 6px;background:radial-gradient(circle at 32% 28%,#8ab4f8,#1a73e8);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 30px rgba(26,115,232,.35)}
.ai-setup .orb svg{width:42px;height:42px}
.ai-chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text3);text-align:center;padding:20px}
.ai-chat-empty svg{width:46px;height:46px;opacity:.35}
.ai-chat-empty .t{font-size:14px;color:var(--text2);font-weight:500}
.ai-chat-empty .s{font-size:12px;line-height:1.7;max-width:280px}
.ai-note{font-size:12px;color:var(--text3);line-height:1.7;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px;text-align:left}

/* ---- 我的 / 账号 ---- */
.profile-card{text-align:center;padding:26px 16px}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:0 auto 12px}
.profile-email{font-size:15px;font-weight:700}
.profile-sub{font-size:12px;color:var(--text3);margin:3px 0 16px}
.auth-msg{font-size:13px;min-height:20px;margin:4px 0 10px;color:var(--red);word-break:break-word}
.auth-ok{color:var(--green)}
</style>

const LS_KEY = 'zhifu_english_v1';
/* ---- 视图渲染缓存：切换页面时避免全量重建（性能优化） ---- */

function markDirty(route){
  if(route){ _vdirty[route] = true; return; }
  for(const r of ['home','flashcards','words','speaking','grammar','stats','ai','profile']) _vdirty[r] = true;

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const todayKey = () => keyOf(new Date());
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d; }
function dayKeyOf(d){ return keyOf(d); }

function defaultStore(){
  return {
    words:[], phrases:[], checkins:{}, logs:[], seeded:false, contentVer:0
  };
}
const CONTENT_VER = 2; // 内置内容版本：更新内置词库/短语后 +1，触发增量并入
let store = loadStore();
function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.seeded) return Object.assign(defaultStore(), s); }
  }catch(e){}
  return null;
}
function seed(){
  const s = defaultStore();
  s.words = BUILTIN_WORDS.map((w,i)=>({
    id:'bw'+i, term:w[0], phon:w[1], mean:w[2], ex:w[3], cat:w[4],
    prof:0, due:'', src:'builtin'
  }));
  s.phrases = BUILTIN_PHRASES.map((p,i)=>({
    id:'bp'+i, term:p[0], mean:p[1], scene:p[2], ex:p[3]||'', prof:0, due:'', src:'builtin'
  }));
  s.seeded = true;
  s.contentVer = CONTENT_VER;
  store = s;
  persist();
}
if(!store){ seed(); }
// 内容增量并入：已有数据升级到新内置内容（保留原有学习进度，仅补齐缺失条目）
function mergeBuiltin(){
  let c = 0;
  const haveW = new Set(store.words.map(w=>w.term.toLowerCase()));
  BUILTIN_WORDS.forEach((w,i)=>{
    if(!haveW.has(w[0].toLowerCase())){
      store.words.push({id:'bw'+Date.now()+c, term:w[0], phon:w[1], mean:w[2], ex:w[3], cat:w[4], prof:0, due:'', src:'builtin'});
      haveW.add(w[0].toLowerCase()); c++;
    }
  });
  let cp = 0;
  const haveP = new Set(store.phrases.map(p=>p.term.toLowerCase()));
  BUILTIN_PHRASES.forEach((p,i)=>{
    if(!haveP.has(p[0].toLowerCase())){
      store.phrases.push({id:'bp'+Date.now()+cp, term:p[0], mean:p[1], scene:p[2], ex:p[3]||'', prof:0, due:'', src:'builtin'});
      haveP.add(p[0].toLowerCase()); cp++;
    }
  });
  store.contentVer = CONTENT_VER;
  persist();
}
if(store.contentVer < CONTENT_VER){ mergeBuiltin(); }
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){ console.warn('persist failed', e); } queueSync(); }

/* 变更即入队：仅在有登录态时触发 */
function queueSync(){
  if(!authUser || !sb || syncing) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushIncremental, 1000);
}
function queueItemSync(){ dirtyItems = true; queueSync(); }

async function pushIncremental(){
  if(!authUser || !sb) return;
  if(pushBusy){ clearTimeout(syncTimer); syncTimer = setTimeout(pushIncremental, 2000); return; }
  pushBusy = true;
  try{
    if(dirtyItems){ await pushItems(); dirtyItems = false; }
    await pushCheckins();
    await pushLogs();
  }catch(e){ console.warn('增量同步失败', e); }
  finally{ pushBusy = false; }
}
async function pushItems(){
  const uid = authUser.id;
  const rows = [];
  let maxTs = lastItemSyncTs;
  store.words.forEach(w=>{
    if((w._ts||0) <= lastItemSyncTs) return;
    rows.push({user_id:uid, id:w.id, kind:'word', term:w.term, phon:w.phon||'', mean:w.mean, ex:w.ex||'', cat:w.cat||'', scene:'', prof:w.prof||0, due:w.due||'', src:w.src||'', updated_at:w._ts||0});
    if((w._ts||0) > maxTs) maxTs = w._ts;
  });
  store.phrases.forEach(p=>{
    if((p._ts||0) <= lastItemSyncTs) return;
    rows.push({user_id:uid, id:p.id, kind:'phrase', term:p.term, phon:'', mean:p.mean, ex:p.ex||'', cat:'', scene:p.scene||'', prof:p.prof||0, due:p.due||'', src:p.src||'', updated_at:p._ts||0});
    if((p._ts||0) > maxTs) maxTs = p._ts;
  });
  if(!rows.length) return;
  for(let i=0;i<rows.length;i+=400){
    const {error} = await sb.from('items').upsert(rows.slice(i,i+400), {onConflict:'user_id,id'});
    if(error) throw error;
  }
  lastItemSyncTs = maxTs;
}
async function pushCheckins(){
  const uid = authUser.id;
  const rows = Object.keys(store.checkins).map(k=>({user_id:uid, date:k, sec:store.checkins[k].sec||0, acts:store.checkins[k].acts||0}));
  if(!rows.length) return;
  for(let i=0;i<rows.length;i+=400){
    const {error} = await sb.from('checkins').upsert(rows.slice(i,i+400), {onConflict:'user_id,date'});

async function pushLogs(){
  const uid = authUser.id;
  const lastTs = parseInt(localStorage.getItem(LS_SYNC_LOG_KEY)||'0', 10) || 0;
  const fresh = store.logs.filter(l=>(l.ts||0) > lastTs);
  if(!fresh.length) return;
  const rows = fresh.map(l=>({user_id:uid, id:logId(l), date:l.date||'', type:l.type||'', count:l.count||1, ts:l.ts||0}));
  for(let i=0;i<rows.length;i+=400){
    const {error} = await sb.from('logs').upsert(rows.slice(i,i+400), {onConflict:'user_id,id'});
    if(error) throw error;
  }
  const maxTs = Math.max.apply(null, fresh.map(l=>l.ts||0));
  localStorage.setItem(LS_SYNC_LOG_KEY, String(maxTs));
}

async function pullAll(){
  const out = {items:[], checkins:[], logs:[]};
  const a = await sb.from('items').select('*');
  if(a.error) throw a.error; out.items = a.data||[];
  const b = await sb.from('checkins').select('*');
  if(b.error) throw b.error; out.checkins = b.data||[];
  const c = await sb.from('logs').select('*').order('ts',{ascending:true}).limit(2000);
  if(c.error) throw c.error; out.logs = c.data||[];
  return out;
}

/* 把云端数据合并进本机（同一词条按 updated_at 较新者胜；打卡取并集） */
function mergeCloud(cloud){
  const byId = {};
  store.words.forEach(w=>byId[w.id] = {kind:'word', item:w});
  store.phrases.forEach(p=>byId[p.id] = {kind:'phrase', item:p});
  cloud.items.forEach(c=>{
    const ex = byId[c.id];
    const cts = c.updated_at||0;
    if(!ex){
      if(c.kind==='word'){ store.words.push({id:c.id, term:c.term, phon:c.phon||'', mean:c.mean, ex:c.ex||'', cat:c.cat||'daily', prof:c.prof||0, due:c.due||'', src:c.src||'cloud', _ts:cts}); }
      else{ store.phrases.push({id:c.id, term:c.term, mean:c.mean, scene:c.scene||'daily', ex:c.ex||'', prof:c.prof||0, due:c.due||'', src:c.src||'cloud', _ts:cts}); }
      return;
    }
    const lts = ex.item._ts||0;
    if(cts > lts){
      const t = ex.item;
      t.term=c.term; t.phon=c.phon||''; t.mean=c.mean; t.ex=c.ex||''; t.prof=c.prof||0; t.due=c.due||''; t.src=c.src||t.src; t._ts=cts;
      if(ex.kind==='word') t.cat=c.cat||t.cat; else t.scene=c.scene||t.scene;
    }
  });
  cloud.checkins.forEach(c=>{
    const l = store.checkins[c.date];
    if(!l){ store.checkins[c.date] = {sec:c.sec||0, acts:c.acts||0}; }
    else { l.sec = Math.max(l.sec||0, c.sec||0); l.acts = Math.max(l.acts||0, c.acts||0); }
  });
  const have = new Set(store.logs.map(l=>logId(l)));
  cloud.logs.forEach(c=>{ if(!have.has(c.id)){ store.logs.push({date:c.date, type:c.type, count:c.count, ts:c.ts}); } });
  if(store.logs.length>3000) store.logs = store.logs.slice(-3000);
}

/* 登录 / 启动时全量合并：先拉云端 → 合并 → 推送本机 */
async function syncMerge(){
  if(!authUser || !sb || syncing) return;
  syncing = true;
  try{
    const cloud = await pullAll();
    mergeCloud(cloud);
    persist();
    markDirty();
    lastItemSyncTs = 0;
    dirtyItems = true;
    await pushIncremental();
  }catch(e){ console.warn('全量同步失败', e); }
  finally{ syncing = false; }
}

function sbErr(e){
  const m = (e && e.message) || '';
  if(/already registered|already been registered/i.test(m)) return '该邮箱已注册，请直接登录';
  if(/invalid login credentials/i.test(m)) return '邮箱或密码错误';

/* ============================================================
   发音（TTS）
   ============================================================ */
let _ttsVoice = null, _ttsVoiceLoaded = false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  if(_ttsVoiceLoaded) return _ttsVoice;
  _ttsVoiceLoaded = true;
  let vs = [];
  try{ vs = speechSynthesis.getVoices() || []; }catch(e){ vs = []; }
  if(!vs.length) return null;
  // 优先自然美音，其次英音，最后任选英文语音
  const pref = ['Google US English','Microsoft Aria Online (Natural) - English (United States)','Microsoft Aria','Microsoft Jenny','Samantha','Microsoft Zira','Daniel'];
  for(let i=0;i<pref.length;i++){
    const hit = vs.find(v=>v.name===pref[i]);
    if(hit){ _ttsVoice = hit; return hit; }
  }
  const us = vs.find(v=>v.lang && v.lang.toLowerCase().indexOf('en-us')===0);
  if(us){ _ttsVoice = us; return us; }
  const en = vs.find(v=>v.lang && v.lang.toLowerCase().indexOf('en')===0);
  _ttsVoice = en || vs[0] || null;
  return _ttsVoice;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = function(){ _ttsVoiceLoaded = false; };
}
function speak(text, rate){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持发音'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if(v){ u.voice = v; u.lang = v.lang || 'en-US'; } else { u.lang = 'en-US'; }
  u.rate = rate || 0.92; u.pitch = 1;
  speechSynthesis.speak(u);
}
function speakStop(){ if('speechSynthesis' in window){ speechSynthesis.cancel(); } }

/* ============================================================
   跟读评分 + 听力练习
   ============================================================ */
function normPhrase(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
}
function wordSim(a, b){
  const A = normPhrase(a).split(' ').filter(Boolean);
  const B = normPhrase(b).split(' ').filter(Boolean);
  if(!A.length || !B.length) return 0;
  const n = A.length, m = B.length;
  const dp = [];
  for(let i=0;i<=n;i++){ dp.push(new Array(m+1).fill(0)); dp[i][0] = i; }
  for(let j=0;j<=m;j++){ dp[0][j] = j; }
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      const cost = A[i-1]===B[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return Math.max(0, 1 - dp[n][m]/Math.max(n, m));
}
let recActive = null;
function reciteSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function startRecite(id){
  const p = store.phrases.find(x=>x.id===id);
  if(!p) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('当前浏览器不支持语音识别，可自己跟读后标记熟练度'); return; }
  if(recActive && recActive._id===id){ stopRecite(); return; }
  if(recActive) stopRecite();
  speakStop();
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  recActive = rec; recActive._id = id;
  const btn = document.getElementById('rec-'+id);
  if(btn){ btn.classList.add('on'); btn.innerHTML = IC.mic+'<span>聆听中…</span>'; }
  const box = document.getElementById('recf-'+id);
  if(box){ box.style.display = 'block'; box.innerHTML = '<div class="rec-hint">请大声朗读：'+esc(p.term)+'</div>'; }
  rec.onresult = function(e){
    let heard = '';
    try{ heard = (e.results[0][0].transcript||'').trim(); }catch(err){ heard = ''; }
    const sim = wordSim(heard, p.term);
    const score = Math.round(sim*100);
    p.score = score; p._ts = nowTs();
    persist(); queueItemSync();
    if(score>=60) logActivity('speak', 1);
    const badge = document.getElementById('recscore-'+id);
    if(badge){ badge.textContent = score+'分'; badge.className = 'score-badge '+(score>=85?'s-g':score>=60?'s-o':'s-r'); }
    if(box){
      const color = score>=85?'var(--green)':score>=60?'var(--amber)':'var(--red)';
      const tip = score>=85?'发音很棒，继续保持！':score>=60?'不错，再多练几遍会更地道':'先点慢速多听几遍，再跟读一次';
      box.innerHTML =
        '<div class="rec-score" style="color:'+color+'">'+score+' 分</div>'+
        '<div class="rec-want">目标：'+esc(p.term)+'</div>'+
        '<div class="rec-heard">听到：'+esc(heard||'(没听清)')+'</div>'+
        '<div class="rec-tip">'+tip+'</div>';
    }
  };
  rec.onerror = function(e){
    const msg = (e.error==='not-allowed'||e.error==='service-not-allowed')
      ? '请允许麦克风权限后再试'
      : (e.error==='no-speech' ? '没听清，请靠近麦克风再试一次' : '语音识别出错，请重试');
    toast(msg);
    if(box){ box.style.display = 'block'; box.innerHTML = '<div class="rec-hint" style="color:var(--red)">'+msg+'</div>'; }
  };
  rec.onend = function(){
    if(recActive === rec) recActive = null;
    if(btn){ btn.classList.remove('on'); btn.innerHTML = IC.mic+'<span>跟读</span>'; }
  };
  try{ rec.start(); }catch(err){ toast('无法启动语音识别'); }
}
function stopRecite(){
  if(recActive){ try{ recActive.abort(); }catch(e){} recActive = null; }
  document.querySelectorAll('.recite-btn.on').forEach(function(b){
    b.classList.remove('on'); b.innerHTML = IC.mic+'<span>跟读</span>';
  });
}

   ============================================================ */
let deck = [], deckIdx = 0, sessionStats = null;
let deckMode = 'all'; // all | word | phrase

function buildDeck(){
  const t = todayKey();
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const pool = [];
  if(deckMode !== 'phrase'){
    const dueW = store.words.filter(w=>w.prof>0 && (!w.due || w.due<=t));
    const newW = store.words.filter(w=>w.prof===0);
    dueW.forEach(w=>pool.push(Object.assign({kind:'word'}, w)));
    newW.forEach(w=>pool.push(Object.assign({kind:'word'}, w)));
  }
  if(deckMode !== 'word'){
    const dueP = store.phrases.filter(p=>p.prof>0 && (!p.due || p.due<=t));
    const newP = store.phrases.filter(p=>p.prof===0);
    dueP.forEach(p=>pool.push(Object.assign({kind:'phrase'}, p)));
    newP.forEach(p=>pool.push(Object.assign({kind:'phrase'}, p)));
  }
  // 优先复习到期项，再补新内容，总量控制在 40
  const dueArr = pool.filter(x=>x.prof>0);
  const newArr = pool.filter(x=>x.prof===0);
  deck = shuffle(dueArr.slice(0,30)).concat(shuffle(newArr.slice(0,12))).slice(0,40);
  deck.forEach(w=>w._req=false);
  deckIdx = 0;
  sessionStats = {again:0, hard:0, good:0, easy:0, total:deck.length};
  markDirty('flashcards');
}

function renderFlashcards(){
  const el = document.querySelector('[data-route="flashcards"]');
  if(!deck.length){ buildDeck(); }
  const modes = [['all','全部'],['word','单词'],['phrase','短语']];
  el.innerHTML = `
    <div class="chips" style="justify-content:space-between;align-items:center">
      <div style="display:flex;gap:6px">
        ${modes.map(m=>`<button class="chip ${deckMode===m[0]?'on':''}" onclick="setDeckMode('${m[0]}')">${m[1]}</button>`).join('')}
      </div>
      <button class="btn btn-tonal btn-sm" onclick="openQuickAdd()">${IC.plus}添加</button>
    </div>
    <div class="flash-wrap mt12">
      <div class="flash-progress"><i id="fp-bar" style="width:0%"></i></div>
      <div class="flash-count" id="fp-count"></div>
      <div class="flash-card" id="fc-card">
        <div class="flash-inner" id="fc-inner">
          <div class="flash-face front" id="fc-front"></div>
          <div class="flash-face back" id="fc-back"></div>
        </div>
      </div>
      <div class="flash-actions" id="fc-actions">
        <button class="btn btn-again" onclick="markCard('again')">不认识</button>
        <button class="btn btn-hard" onclick="markCard('hard')">模糊</button>
        <button class="btn btn-good" onclick="markCard('good')">认识</button>
        <button class="btn btn-easy" onclick="markCard('easy')">掌握</button>
      </div>
    </div>`;
  renderCard();
}
function setDeckMode(m){ deckMode = m; deck = []; markDirty('flashcards'); render(); }
function currentCard(){ return deck[deckIdx]; }
function toggleFlip(){
  const c = document.getElementById('fc-card');
  if(c) c.classList.toggle('flipped');
}
function renderCard(){
  const w = currentCard();
  if(!w){
    const wrap = document.querySelector('[data-route="flashcards"] .flash-wrap');
    if(wrap) wrap.innerHTML = '<div class="flash-summary"><h3>太棒了！</h3><div class="note">本轮复习完成</div><div class="actions-bar"><button class="btn btn-primary btn-block" onclick="buildDeck();render()">再来一轮</button></div></div>';
    return;
  }
  const isPhrase = w.kind === 'phrase';
  const catLabel = isPhrase ? sceneName(w.scene) : catName(w.cat);
  document.getElementById('fp-bar').style.width = (deckIdx/deck.length*100)+'%';
  document.getElementById('fp-count').textContent = (deckIdx+1)+' / '+deck.length;
  document.getElementById('fc-front').innerHTML = `
    <span class="category">${esc(catLabel)}${isPhrase?' · 短语':''}</span>
    <div class="term" style="font-size:${isPhrase?'26px':'32px'}">${esc(w.term)}</div>
    ${w.phon?'<div class="phon">'+esc(w.phon)+'</div>':''}
    <button class="btn-icon" data-speak="${esc(w.term)}" style="position:absolute;bottom:46px;left:50%;transform:translateX(-50%)">${IC.play}</button>
    <div class="flip-hint">点击卡片查看释义</div>`;
  document.getElementById('fc-back').innerHTML = `
    <div class="meaning">${esc(w.mean)}</div>
    ${w.ex?'<div class="example">'+esc(w.ex)+'</div>':''}
    <div class="flip-hint">${PROF_LABEL[w.prof]} · 点击返回</div>`;
  const card = document.getElementById('fc-card');
  card.classList.remove('flipped');
}
function markCard(level){
  const w = currentCard();
  if(!w) return;
  const profMap = {again:-1, hard:0, good:1, easy:2};
  const dayMap  = {again:0, hard:1, good:3, easy:7};
  w.prof = Math.max(0, Math.min(4, w.prof + profMap[level]));
  w.due = dayKeyOf(addDays(dayMap[level]));
  w._ts = nowTs();
  // 写回词库，确保熟练度与复习日期持久化（deck 是副本，需同步回 store）
  const srcArr = w.kind==='phrase' ? store.phrases : store.words;
  const orig = srcArr.find(x=>x.id===w.id);
  if(orig){ orig.prof = w.prof; orig.due = w.due; orig._ts = w._ts; }
  if(level==='again' && !w._req){ w._req = true; deck.push(w); }
  sessionStats[level]++;
  logActivity('flash', 1);
  queueItemSync();
  if(w.kind==='word') _vdirty.words = true; else _vdirty.speaking = true;
  deckIdx++;
  if(deckIdx >= deck.length){
    const wrap = document.querySelector('[data-route="flashcards"] .flash-wrap');
    const got = sessionStats.good + sessionStats.easy;
    wrap.innerHTML = `
      <div class="flash-summary">
        <h3>本轮完成！</h3>
        <div class="note">共复习 ${sessionStats.total} 张卡片，认识/掌握 ${got} 张</div>
        <div class="actions-bar">
          <button class="btn btn-primary btn-block" onclick="buildDeck();render()">再来一轮</button>
        </div>
      </div>`;
  } else {
    renderCard();
  }
}

function renderWordsList(){
  const list = store.words.filter(w=>
    (wordFilter.cat==='all' || w.cat===wordFilter.cat) &&
    (!wordFilter.q || (w.term+' '+w.mean+' '+(w.phon||'')).toLowerCase().includes(wordFilter.q.toLowerCase()))
  );
  const box = document.getElementById('w-list');
  if(!box) return;
  if(!list.length){
    box.innerHTML = `<div class="empty-state">
      <div class="t">没有找到相关词汇</div>
      <div class="s">试试其他关键词，或添加你的生词</div></div>`;
    return;
  }
  box.innerHTML = list.map(w=>`
    <div class="word-row" onclick="openWordDetail('${w.id}')">
      <div class="w-main">
        <div><span class="term">${esc(w.term)}</span>${w.phon?'<span class="phon">'+esc(w.phon)+'</span>':''}</div>
        <div class="mean">${esc(w.mean)}</div>

    </div>`).join('');
}

function saveQuickAdd(){
  const term = document.getElementById('qa-term').value.trim();
  const mean = document.getElementById('qa-mean').value.trim();
  if(!term || !mean){ toast('请填写内容与释义'); return; }
  const ex = document.getElementById('qa-ex').value.trim();
  if(quickAddType==='word'){
    const phon = document.getElementById('qa-phon').value.trim();
    const cat = document.getElementById('qa-cat').value;
    if(store.words.some(w=>w.term.toLowerCase()===term.toLowerCase())){ toast('该单词已存在'); return; }
    store.words.push({id:'uw'+Date.now(), term, phon, mean, ex, cat, prof:0, due:'', src:'user', _ts:nowTs()});
  } else {
    const scene = document.getElementById('qa-scene').value;
    if(store.phrases.some(p=>p.term.toLowerCase()===term.toLowerCase())){ toast('该短语已存在'); return; }
    store.phrases.push({id:'up'+Date.now(), term, mean, scene, ex, prof:0, due:'', src:'user', _ts:nowTs()});
  }
  persist(); logActivity('add', 1); queueItemSync(); closeModal(); toast('已添加：'+term); markItemViews(); render();

function saveEditWord(id){
  const w = store.words.find(x=>x.id===id);
  if(!w) return;
  w.term = document.getElementById('ew-term').value.trim() || w.term;
  w.phon = document.getElementById('ew-phon').value.trim();
  w.mean = document.getElementById('ew-mean').value.trim() || w.mean;
  w.ex = document.getElementById('ew-ex').value.trim();
  w.cat = document.getElementById('ew-cat').value;
  w._ts = nowTs();
  persist(); closeModal(); toast('已保存'); markItemViews(); render();
  queueItemSync();
}
async function delWord(id){
  const i = store.words.findIndex(x=>x.id===id);
  if(i>-1){
    store.words.splice(i,1); persist(); closeModal(); toast('已删除'); markItemViews(); render();
    if(authUser && sb){ try{ await sb.from('items').delete().eq('id', id); }catch(e){} }
  }
}

function openImport(){
  openModal(`
    <div class="modal-head"><h3>导入词表</h3><button class="btn-icon" onclick="closeModal()">${IC.close}</button></div>
    <div class="import-hint">
      每行一条，用 制表符(Tab)、逗号 或 | 分隔，字段顺序：<b>单词, 音标, 释义, 例句</b>（音标/例句可省略）。<br>
      示例：<br>follow up, ˈfɑːloʊ ʌp, 跟进, I'll follow up with you.<br>delegate, 委派
    </div>
    <div class="field"><label>粘贴词表</label><textarea id="imp-text" placeholder="在此粘贴，或点击下方按钮选择文件"></textarea></div>
    <div class="actions-bar">
      <button class="btn btn-outline" onclick="pickFile()">选择 CSV / txt 文件</button>
      <button class="btn btn-primary" onclick="doImport()">开始导入</button>
    </div>
    <input type="file" class="hidden-file" id="imp-file" accept=".csv,.txt" onchange="readImportFile(event)">
    <div id="imp-result" class="mt12"></div>
  `);
}
function pickFile(){ document.getElementById('imp-file').click(); }
function readImportFile(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ document.getElementById('imp-text').value = r.result; toast('已读取文件，点击开始导入'); };
  r.readAsText(f, 'utf-8');
  ev.target.value='';
}
function doImport(){
  const text = document.getElementById('imp-text').value;
  if(!text.trim()){ toast('请先粘贴或选择词表'); return; }
  const res = parseImport(text);
  const box = document.getElementById('imp-result');
  if(res.added>0) logActivity('import', res.added);
  if(res.added>0) queueItemSync();
  box.innerHTML = `<div style="font-size:14px;line-height:1.8;color:var(--text2)">
    成功导入 <b style="color:var(--green)">${res.added}</b> 条；跳过重复 <b>${res.skip}</b> 条；无效行 <b>${res.bad}</b> 条。</div>`;
  markItemViews();
  render();
}
function parseImport(text){
  let added=0, skip=0, bad=0;
  const lines = text.split(/\r?\n/);
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const parts = line.split(/[\t,|]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length<2){ bad++; continue; }
    const term = parts[0];
    if(store.words.some(w=>w.term.toLowerCase()===term.toLowerCase())){ skip++; continue; }
    let phon='', mean='', ex='';
    if(parts.length===2){ mean = parts[1]; }
    else if(parts.length===3){ phon = parts[1]; mean = parts[2]; }
    else { phon = parts[1]; mean = parts[2]; ex = parts.slice(3).join(' '); }
    store.words.push({id:'uw'+Date.now()+added, term, phon, mean, ex, cat:'daily', prof:0, due:'', src:'import', _ts:nowTs()+added});
    added++;
  }
  persist();
  return {added, skip, bad};
}

function answerQuiz(gi, chosen){
  const g = BUILTIN_GRAMMAR[gi];

   渲染：统计
   ============================================================ */
let calOffset = 0;
function calcStreak(){
  let n = 0;
  const d = new Date();
  if(!(store.checkins[todayKey()])) d.setDate(d.getDate()-1); // 今天没打卡则从昨天起算
  for(;;){
    const k = dayKeyOf(d);
    if(store.checkins[k] && store.checkins[k].acts>0){ n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}
function totalSec(){
  let s=0; for(const k in store.checkins){ s+=store.checkins[k].sec||0; }
  return s;
}
function fmtMin(sec){ const m = Math.round(sec/60); if(m<60) return m+' 分钟'; return Math.floor(m/60)+' 小时 '+(m%60)+' 分'; }
function renderStats(){
  const el = document.querySelector('[data-route="stats"]');
  const items = allItems();
  const mastered = items.filter(x=>x.prof>=3).length;
  const learned = items.filter(x=>x.prof>0).length;
  const streak = calcStreak();
  const profDist = [0,1,2,3,4].map(l=>items.filter(x=>x.prof===l).length);
  const week = last7();
  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-pill"><div class="v">${learned}</div><div class="l">已学词汇</div></div>
      <div class="stat-pill"><div class="v">${mastered}</div><div class="l">已掌握</div></div>
      <div class="stat-pill"><div class="v">${streak}</div><div class="l">连续打卡</div></div>
    </div>
    <div class="section-title"><h2>打卡日历</h2><div style="font-size:12px;color:var(--text2)">累计学习 ${fmtMin(totalSec())}</div></div>
    <div class="card" id="cal-card"></div>
    <div class="section-title"><h2>熟练度分布</h2></div>
    <div class="card">
      ${PROF_LABEL.map((l,i)=>`
        <div class="bar-row">
          <span class="bl">${l}</span>
          <span class="bt"><i style="width:${store.words.length?Math.round(profDist[i]/store.words.length*100):0}%"></i></span>
          <span class="bn">${profDist[i]}</span>
        </div>`).join('')}
    </div>
    <div class="section-title"><h2>近 7 天学习量</h2></div>
    <div class="card"><div class="week-bars">
      ${week.map(d=>`
        <div class="week-bar">
          <div class="val">${d.acts?d.acts:''}</div>
          <div class="col" style="height:${d.max?Math.round(d.acts/d.max*100)+'%':'4px'}"></div>
          <div class="lb">${d.label}</div>
        </div>`).join('')}
    </div></div>
  `;
  renderCalendar();
}
function last7(){
  const arr = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = dayKeyOf(d);
    const c = store.checkins[k]||{acts:0};
    arr.push({key:k, acts:c.acts||0, label:['日','一','二','三','四','五','六'][d.getDay()]});
  }
  const max = Math.max(1, ...arr.map(x=>x.acts));
  arr.forEach(x=>x.max=max);
  return arr;
}
function renderCalendar(){
  const box = document.getElementById('cal-card');
  if(!box) return;
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth()+calOffset, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const firstDow = base.getDay();
  const days = new Date(y, m+1, 0).getDate();
  const today = todayKey();
  let html = `
    <div class="cal-head">
      <button class="cal-btn" onclick="calOffset--;markDirty('stats');render()">‹</button>
      <span class="ym">${y} 年 ${m+1} 月</span>
      <button class="cal-btn" onclick="calOffset++;markDirty('stats');render()">›</button>
    </div>
    <div class="cal-grid">
      ${['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('')}
  `;
  for(let i=0;i<firstDow;i++) html += '<div></div>';
  for(let d=1; d<=days; d++){
    const k = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const done = store.checkins[k] && store.checkins[k].acts>0;
    const isToday = k===today;
    html += `<div class="cal-cell ${done?'done':''} ${isToday?'today':''}">${d}</div>`;
  }
  html += '</div>';
  if(calOffset!==0){
    html += `<div style="text-align:center;margin-top:12px"><button class="btn btn-sm btn-outline" onclick="calOffset=0;markDirty('stats');render()">回到本月</button></div>`;
  }
  box.innerHTML = html;
}

const AI_SET_KEY = 'zhifu_ai_settings_v1';
const AI_MSGS_KEY = 'zhifu_ai_msgs_v1';
const AI_PROVIDERS = [
  {key:'deepseek', name:'DeepSeek（推荐）', base:'https://api.deepseek.com', model:'deepseek-chat'},
  {key:'moonshot', name:'Moonshot Kimi', base:'https://api.moonshot.cn/v1', model:'moonshot-v1-8k'},

];
const AI_SYSTEM = '你是一个友善的英语口语陪练 AI，名字叫 Mia，和用户进行日常英文闲聊，帮助职场人士练开口说英语。规则：1. 尽量用简单自然的英文回复，像朋友聊天；2. 如果用户用中文，你可以用中文简短回应，但尽量引导用户用英文表达，并给出一两句英文示范；3. 用户说错或表达不自然时，温和地简短纠正并给出更自然的说法，不要打断聊天节奏；4. 每次回复 2-4 句话，不要太长；5. 话题围绕日常生活：天气、工作、美食、周末安排、电影音乐、旅行等；6. 结尾可以用一个轻松的问题把话题抛回给用户，鼓励继续聊。';

let aiSettings = aiLoadSettings();
let aiMsgs = [];
let aiBusy = false;
let aiSpeechOn = true;
let aiRec = null;

function aiLoadSettings(){
  try{ const r = localStorage.getItem(AI_SET_KEY); if(r){ const s = JSON.parse(r); if(s && s.apiKey) return s; } }catch(e){}
  return {provider:'deepseek', base:'https://api.deepseek.com', model:'deepseek-chat', apiKey:''};
}
function aiSaveSettings(s){ aiSettings = s; try{ localStorage.setItem(AI_SET_KEY, JSON.stringify(s)); }catch(e){} }
function aiLoadMsgs(){
  try{ const r = localStorage.getItem(AI_MSGS_KEY); if(r){ const a = JSON.parse(r); if(Array.isArray(a)) return a.slice(-40); } }catch(e){}
  return [];
}
function aiSaveMsgs(){ aiMsgs = aiMsgs.slice(-40); try{ localStorage.setItem(AI_MSGS_KEY, JSON.stringify(aiMsgs)); }catch(e){} }
function aiConfigured(){ return !!(aiSettings.apiKey && aiSettings.apiKey.trim()); }
function aiCanMic(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

function renderAI(){
  const el = document.querySelector('[data-route="ai"]');
  if(!aiConfigured()){
    el.innerHTML = `
      <div class="ai-setup">
        <div class="orb">${IC.chat}</div>
        <h2>AI 自由对话</h2>
        <p>和 Mia 像朋友一样用英语日常闲聊，练开口、即时纠错、AI 朗读。首次使用需配置一个 AI 接口。</p>
        <div class="card" style="text-align:left;margin-top:18px">
          <div class="plan-step"><div class="n">1</div><div><div class="b">申请接口 Key</div><div class="s">推荐 DeepSeek：platform.deepseek.com 注册 → API Keys → 创建（按用量计费，充 10 元可用很久）</div></div></div>
          <div class="plan-step"><div class="n">2</div><div><div class="b">填入应用</div><div class="s">点下方「配置接口」，选择服务商、粘贴 API Key 即可开始对话</div></div></div>
        </div>
        <div class="actions-bar" style="margin-top:20px">
          <button class="btn btn-primary btn-block" onclick="aiOpenSettings()">配置接口</button>
        </div>
        <div class="ai-note">语音：安卓手机浏览器可直接点麦克风说话；iPhone 受系统限制不能录音，用打字输入即可（AI 仍会朗读回复）。</div>
      </div>
    `;
    return;
  }
  aiMsgs = aiLoadMsgs();
  el.innerHTML = `
    <div class="ai-chat-page">
      <div class="ai-chat-head">
        <span class="role">Mia · 日常闲聊</span>
        <span style="flex:1"></span>
        <button class="btn-icon" onclick="aiOpenSettings()" title="接口设置">${IC.settings}</button>
        <button class="btn-icon" onclick="aiToggleSpeech()" id="ai-speak-btn" title="AI 朗读开关">${IC.volume}</button>
        <button class="btn-icon" onclick="aiClear()" title="清空对话">${IC.trash}</button>
      </div>
      <div class="ai-msgs" id="ai-msgs"></div>
      <div class="ai-input-bar">
        <div class="inp">
          <input id="ai-input" placeholder="用英语说点什么…" enterkeyhint="send" onkeydown="if(event.key==='Enter')aiSend()">
          ${aiCanMic()?`<button class="ai-send mic" id="ai-mic-btn" onclick="aiMic()" title="语音输入">${IC.mic}</button>`:''}
        </div>
        <button class="ai-send" id="ai-send-btn" onclick="aiSend()">${IC.send}</button>
      </div>
    </div>
  `;
  const b = document.getElementById('ai-speak-btn');
  if(b) b.style.opacity = aiSpeechOn ? '1' : '.35';
  aiRenderMsgs();
}
function aiPush(role, text){
  aiMsgs.push({role, text, ts:Date.now()});
  aiSaveMsgs();
}
function aiClear(){ aiMsgs = []; aiSaveMsgs(); markDirty('ai'); render(); toast('对话已清空'); }
function aiToggleSpeech(){
  aiSpeechOn = !aiSpeechOn;
  const b = document.getElementById('ai-speak-btn');
  if(b) b.style.opacity = aiSpeechOn ? '1' : '.35';
  toast(aiSpeechOn ? '已开启 AI 朗读' : '已关闭 AI 朗读');
}
function aiRenderMsgs(){
  const box = document.getElementById('ai-msgs');
  if(!box) return;
  if(!aiMsgs.length){
    box.innerHTML = `<div class="ai-chat-empty">
      ${IC.chat}
      <div class="t">和 Mia 聊起来吧</div>
      <div class="s">说一句日常话题开始，比如 “Hi Mia, how was your day?”</div>
    </div>`;
    return;
  }
  box.innerHTML = aiMsgs.map(m=>{
    if(m.role==='user'){
      return `<div class="ai-msg user"><div class="bubble">${esc(m.text)}</div><div class="meta"></div></div>`;
    }
    return `<div class="ai-msg ai"><div class="bubble">${esc(m.text)}</div><div class="meta"><button class="btn-icon" style="width:26px;height:26px" data-speak="${escAttr(m.text)}">${IC.volume}</button></div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}
async function aiSend(){
  if(aiBusy){ return; }
  const inp = document.getElementById('ai-input');
  if(!inp) return;
  const text = (inp.value||'').trim();
  if(!text){ toast('先输入一句话吧'); return; }
  inp.value = '';
  aiPush('user', text);
  aiRenderMsgs();
  await aiCall();
}
async function aiCall(){
  if(!aiConfigured()){ aiOpenSettings(); return; }
  aiBusy = true;
  const box = document.getElementById('ai-msgs');
  if(box){
    const d = document.createElement('div');
    d.className = 'ai-typing'; d.id = 'ai-typing';
    d.innerHTML = '<i></i><i></i><i></i>';
    box.appendChild(d); box.scrollTop = box.scrollHeight;
  }
  const history = aiMsgs.map(m=>({role: m.role==='user' ? 'user' : 'assistant', content: m.text}));
  const payload = {
    model: aiSettings.model,
    messages: [{role:'system', content: AI_SYSTEM}].concat(history),
    temperature: 0.8
  };
  try{
    const base = (aiSettings.base||'').replace(/\/+$/,'');
    const res = await fetch(base + '/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+aiSettings.apiKey},
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      let msg = '请求失败 ('+res.status+')';
      if(res.status===401||res.status===403) msg = 'API Key 无效或已失效，请到设置里检查';
      else if(res.status===404) msg = '接口地址或模型名有误，请检查设置';
      else if(res.status===429) msg = '请求过于频繁，请稍后再试';
      else { try{ const j = await res.json(); if(j.error && j.error.message) msg = String(j.error.message).slice(0,120); }catch(e){} }
      throw new Error(msg);
    }
    const data = await res.json();
    const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
    if(!reply) throw new Error('AI 返回为空，请重试');
    aiPush('ai', reply);
    aiRenderMsgs();
    if(aiSpeechOn) speak(reply, 0.95);
    logActivity('ai', 1);
  }catch(err){
    toast('对话失败：' + (err.message || '请检查网络与接口设置'));
  }finally{
    aiBusy = false;
    const t = document.getElementById('ai-typing'); if(t) t.remove();
    if(box) box.scrollTop = box.scrollHeight;
  }
}
function aiMic(){
  if(!aiCanMic()){ toast('当前浏览器不支持语音输入'); return; }
  if(aiRec){ aiRec.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  aiRec = new SR();
  aiRec.lang = 'en-US';
  aiRec.interimResults = false;
  aiRec.maxAlternatives = 1;
  const btn = document.getElementById('ai-mic-btn');
  if(btn) btn.classList.add('rec');
  aiRec.onresult = (ev)=>{
    const txt = ev.results[0][0].transcript;
    const inp = document.getElementById('ai-input');
    if(inp) inp.value = txt;
    aiSend();
  };
  aiRec.onerror = (e)=>{
    const b = document.getElementById('ai-mic-btn'); if(b) b.classList.remove('rec');
    if(e.error && e.error !== 'aborted') toast('语音识别失败：' + (e.error==='not-allowed' ? '未授权麦克风，请在浏览器设置中允许' : e.error));
    aiRec = null;
  };
  aiRec.onend = ()=>{ const b = document.getElementById('ai-mic-btn'); if(b) b.classList.remove('rec'); aiRec = null; };
  aiRec.start();
}
function aiOpenSettings(){
  const s = aiSettings;
  const opts = AI_PROVIDERS.map(p=>`<option value="${p.key}" ${p.key===s.provider?'selected':''}>${p.name}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>配置 AI 接口</h3><button class="btn-icon" onclick="closeModal()">${IC.close}</button></div>

      <label>模型</label>
      <input id="ai-model" value="${escAttr(s.model)}" placeholder="deepseek-chat">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="ai-key" type="password" value="${escAttr(s.apiKey)}" placeholder="sk-..." autocomplete="off">
    </div>
    <div class="ai-note">Key 仅保存在本机浏览器，不会上传到服务器。申请 Key：platform.deepseek.com 注册 → API Keys → 创建（按用量计费，便宜）。</div>
    <div class="actions-bar">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="aiSaveSettingsModal()">保存</button>
    </div>
  `);
}
function aiProviderChanged(){
  const p = AI_PROVIDERS.find(x=>x.key===document.getElementById('ai-provider').value);
  if(!p) return;
  document.getElementById('ai-base-field').style.display = p.key==='custom' ? '' : 'none';

    document.getElementById('ai-base').value = p.base;
    document.getElementById('ai-model').value = p.model;
  }

function aiSaveSettingsModal(){
  const provider = document.getElementById('ai-provider').value;
  const p = AI_PROVIDERS.find(x=>x.key===provider);
  let base = document.getElementById('ai-base').value.trim();
  const model = document.getElementById('ai-model').value.trim();
  const apiKey = document.getElementById('ai-key').value.trim();
  if(provider!=='custom' && p) base = p.base;
  if(!apiKey){ toast('请填写 API Key'); return; }
  if(!model){ toast('请填写模型名'); return; }
  aiSaveSettings({provider, base, model, apiKey});
  closeModal();
  toast('接口已保存');
  markDirty('ai');
  render();
}

/* ============================================================
   弹窗 & toast
   ============================================================ */
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
let toastTimer=null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   工具函数
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }
function dotsHtml(prof, max){
  let h='<span class="dots">';
  for(let i=0;i<max;i++) h += `<i class="${i<prof?'f':''}"></i>`;
  return h+'</span>';
}
function topSub(text){ document.getElementById('top-sub').textContent = text; }

/* ============================================================
   总渲染
   ============================================================ */
const RENDER = {
  home: renderHome, flashcards: renderFlashcards, words: renderWords,
  speaking: renderSpeaking, grammar: renderGrammar, stats: renderStats, ai: renderAI, profile: renderProfile
};
const SUBTITLE = {
  home:'职场英语学习', flashcards:'闪卡 · 词汇记忆', words:'词库管理',
  speaking:'口语 · 高频表达', grammar:'语法查漏', stats:'学习统计', ai:'AI 自由对话', profile:'我的 · 账号'
};
function render(){
  const route = parseHash();
  setRoute(route);
  topSub(SUBTITLE[route]||'');
  if(!RENDER[route]) return;
  // 性能优化：视图 DOM 常驻页面，数据未变化时直接复用，避免每次切换全量重建
  if(_vhtml[route] && !_vdirty[route]) return;
  RENDER[route]();
  _vhtml[route] = true;
  _vdirty[route] = false;
}

/* ---- 事件绑定 ---- */
document.querySelectorAll('.nav-item').forEach(b=>{
  b.addEventListener('click', ()=>go(b.dataset.route));
});
// 全局点击：发音按钮优先，其次闪卡翻面（事件委托，避免内联引号转义问题）
document.addEventListener('click', e=>{
  const sp = e.target.closest('[data-speak]');
  if(sp){ speak(sp.getAttribute('data-speak'), parseFloat(sp.getAttribute('data-rate'))||0.92); return; }
  const card = e.target.closest('.flash-card');
  if(card && document.querySelector('[data-route="flashcards"]').classList.contains('active')){
    card.classList.toggle('flipped');
  }
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', ()=>{ lastActive = Date.now(); });

render();
initAuth();
// 注册 Service Worker：支持桌面安装与离线使用
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW 注册失败', e); });
}
</script>
